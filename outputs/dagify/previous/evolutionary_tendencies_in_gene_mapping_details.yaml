          name: cretaceous
          type: dict
        - description: Output of select_gene_mapping_methods; each dict contains method_name
            and description.
          name: mapping_methods
          type: list[dict]
        raises:
        - description: If any of the input dictionaries are missing required fields
            or are empty.
          type: ValueError
        - description: If input types do not match the expected signatures.
          type: TypeError
        returns:
          description: A dictionary with keys species_list (List[str]), comparison_summary
            (str), key_trends (List[str]), and data_quality_flag (bool).
          type: dict
        summary: Compare genomic structures across multiple species and identify key
          evolutionary trends.
    prompt: Compare the overall genomic structure of different species and draw conclusions
