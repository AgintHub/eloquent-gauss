  compare_genomic_structures_across_species:
    agent: false
    code_node_type: stub
    description: Analyze the genomic structure of various species and draw conclusions
      on gene mapping trends
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass EvaluateGenomicDiversityDinosaursOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for evaluate_genomic_diversity_dinosaurs node outputs.\"\"\"\n    species_list:\
      \ List[str] = (\n        Field(..., description=\"List of dinosaur species evaluated.\"\
      )\n    )\n    diversity_index: List[float] = (\n        Field(..., description=\"\
      Corresponding genomic diversity index for each species.\")\n    )\n    key_insights:\
      \ List[str] = (\n        Field(..., description=\"Concise insights linking diversity\
      \ metrics to evolutionary processes.\")\n    )\n\n\nclass EvaluateGenomicDiversityCretaceousOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for evaluate_genomic_diversity_cretaceous node outputs.\"\
      \"\"\n    genomic_diversity_factors: List[str] = (\n        Field(..., description=\"\
      List of key factors influencing genomic diversity during the Cretaceous (e.g.,\
      \ gene regulation, epigenetic mechanisms).\")\n    )\n    diversity_metrics:\
      \ List[float] = (\n        Field(..., description=\"Quantitative metrics of\
      \ genomic diversity (e.g., nucleotide diversity indices, haplotype variation\
      \ scores).\")\n    )\n    evolutionary_impact: List[str] = (\n        Field(...,\
      \ description=\"Explanation of how observed diversity patterns relate to gene\
      \ evolution theories (speciation, drift, etc.).\")\n    )\n    supports_theories:\
      \ bool = (\n        Field(..., description=\"Whether the assessment supports\
      \ existing genetic evolution theories from parent nodes.\")\n    )\n    summary_assessment:\
      \ str = (\n        Field(..., description=\"Concise summary of genomic diversity's\
      \ role in shaping evolutionary tendencies during the Cretaceous.\")\n    )\n\
      \n\nclass SelectGeneMappingMethodsOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for select_gene_mapping_methods node outputs.\"\"\"\n    method_name: str\
      \ = Field(..., description=\"Name of the gene mapping method\")\n    description:\
      \ str = Field(..., description=\"Brief description of the method\")\n\n\nclass\
      \ CompareGenomicStructuresAcrossSpeciesOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for compare_genomic_structures_across_species node outputs.\"\"\"\n\
      \    species_list: List[str] = (\n        Field(..., description=\"List of species\
      \ compared in this analysis\")\n    )\n    comparison_summary: str = (\n   \
      \     Field(..., description=\"Concise narrative summarizing key differences\
      \ and similarities in genomic structures\")\n    )\n    key_trends: List[str]\
      \ = (\n        Field(..., description=\"Primary trends or patterns identified\
      \ across species (e.g., conserved synteny, rearrangement hotspots)\")\n    )\n\
      \    data_quality_flag: bool = (\n        Field(..., description=\"Indicates\
      \ whether the underlying genomic data meets quality thresholds for reliable\
      \ comparison\")\n    )\n\n\ndef compare_genomic_structures_across_species(evaluate_genomic_diversity_dinosaurs_input:\
      \ EvaluateGenomicDiversityDinosaursOutput, evaluate_genomic_diversity_cretaceous_input:\
      \ EvaluateGenomicDiversityCretaceousOutput, select_gene_mapping_methods_input:\
      \ SelectGeneMappingMethodsOutput, **kwargs) -> CompareGenomicStructuresAcrossSpeciesOutput:\n\
      \    \"\"\"\n    Compare genomic structures across multiple species and identify\
      \ key\n    evolutionary trends.\n\n    Parameters\n    ----------\n    dinosaurs\
      \ : dict\n        Output of evaluate_genomic_diversity_dinosaurs; contains\n\
      \        species_list, diversity_index, and key_insights.\n    cretaceous :\
      \ dict\n        Output of evaluate_genomic_diversity_cretaceous; contains\n\
      \        genomic_diversity_factors, diversity_metrics, evolutionary_impact,\n\
      \        supports_theories, and summary_assessment.\n    mapping_methods : list[dict]\n\
      \        Output of select_gene_mapping_methods; each dict contains\n       \
      \ method_name and description.\n\n    Returns\n    -------\n    dict\n     \
      \   A dictionary with keys species_list (List[str]), comparison_summary\n  \
      \      (str), key_trends (List[str]), and data_quality_flag (bool).\n\n    Raises\n\
      \    ------\n    ValueError\n        If any of the input dictionaries are missing\
      \ required fields or are\n        empty.\n    TypeError\n        If input types\
      \ do not match the expected signatures.\n\n    Examples\n    --------\n    >>>\
      \ dinosaurs = {\n    ...     'species_list': ['Tyrannosaurus', 'Velociraptor'],\n\
      \    ...     'diversity_index': [0.23, 0.19],\n    ...     'key_insights': ['high\
      \ intra‑species variation', 'low inter‑species\n    divergence']\n    >>> }\n\
      \    >>> cretaceous = {\n    ...     'genomic_diversity_factors': ['epigenetic\
      \ modifications'],\n    ...     'diversity_metrics': [0.15],\n    ...     'evolutionary_impact':\
      \ ['adaptive radiation'],\n    ...     'supports_theories': True,\n    ... \
      \    'summary_assessment': 'moderate diversity with strong selection\n    signals'\"\
      \                 \"}\n    >>> mapping_methods = [{'method_name': 'linkage analysis',\
      \ 'description':\n    'Associates markers with phenotypes.'}]\n    >>> result\
      \ = compare_genomic_structures_across_species(dinosaurs,\n    cretaceous, mapping_methods)\n\
      \    >>> print(result['comparison_summary'])\n    'The comparison indicates\
      \ conserved synteny across most dinosaur genomes,\n    with rearrangement hotspots\
      \ near the 3ʹ ends of chromosomes. Cretaceous\n    genomes exhibit moderate\
      \ diversity driven by epigenetic changes, supporting\n    adaptive radiation\
      \ theories.'\n\n    >>> result = compare_genomic_structures_across_species(dinosaurs,\n\
      \    cretaceous, mapping_methods)\n    >>> print(result['key_trends'])\n   \
      \ ['Conserved synteny', 'Rearrangement hotspots', 'Epigenetic‑driven\n    diversity']\n\
      \n    \"\"\"\n    return CompareGenomicStructuresAcrossSpeciesOutput(\n    \
      \    species_list=[],\n        comparison_summary=\"\",\n        key_trends=[],\n\
      \        data_quality_flag=False,\n    )"
    name: compare_genomic_structures_across_species
    nodes_depended_on:
    - evaluate_genomic_diversity_dinosaurs
    - evaluate_genomic_diversity_cretaceous
