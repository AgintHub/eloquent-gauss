          - '  ''panthera_tigris'': {''diversity'': 0.45, ''haplotypes'': 120},'
          - '  ''felis_catus'': {''diversity'': 0.32, ''haplotypes'': 85}'
          - '}, [{''method_name'': ''linkage_analysis'', ''description'': ''...''}])'
          output: '{''average_genetic_diversity'': 0.385, ''species_studied'': [''panthera_tigris'',
