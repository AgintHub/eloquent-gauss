      docstring:
        examples:
        - lines:
          - dinosaurs = {
          - '    ''species_list'': [''Tyrannosaurus'', ''Velociraptor''],'
          - '    ''diversity_index'': [0.23, 0.19],'
          - '    ''key_insights'': [''high intra‑species variation'', ''low inter‑species
            divergence'']'
          - '}'
          - cretaceous = {
          - '    ''genomic_diversity_factors'': [''epigenetic modifications''],'
          - '    ''diversity_metrics'': [0.15],'
          - '    ''evolutionary_impact'': [''adaptive radiation''],'
          - '    ''supports_theories'': True,'
          - "    'summary_assessment': 'moderate diversity with strong selection signals'\"\
            \n                \"}"
          - 'mapping_methods = [{''method_name'': ''linkage analysis'', ''description'':
            ''Associates markers with phenotypes.''}]'
          - result = compare_genomic_structures_across_species(dinosaurs, cretaceous,
            mapping_methods)
          - print(result['comparison_summary'])
          output: '''The comparison indicates conserved synteny across most dinosaur
            genomes, with rearrangement hotspots near the 3ʹ ends of chromosomes.
            Cretaceous genomes exhibit moderate diversity driven by epigenetic changes,
            supporting adaptive radiation theories.'''
        - lines:
          - result = compare_genomic_structures_across_species(dinosaurs, cretaceous,
            mapping_methods)
          - print(result['key_trends'])
          output: '[''Conserved synteny'', ''Rearrangement hotspots'', ''Epigenetic‑driven
            diversity'']'
        parameters:
        - description: Output of evaluate_genomic_diversity_dinosaurs; contains species_list,
            diversity_index, and key_insights.
          name: dinosaurs
          type: dict
        - description: Output of evaluate_genomic_diversity_cretaceous; contains genomic_diversity_factors,
