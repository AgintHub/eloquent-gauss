dag_type: typed
description: Generated workflow from UI.
name: evolutionary_tendencies_in_gene_mapping
nodes:
  analyze_population_genetics_data:
    agent: false
    description: Analyze data from existing population genetics studies on gene variation
      and divergence.
    name: analyze_population_genetics_data
    nodes_depended_on:
    - select_gene_mapping_methods
    nodes_dependent_on: []
    output_structure:
    - description: Average genetic diversity metric calculated across studied populations
      key: average_genetic_diversity
      type: float
    - description: List of species included in the population genetics analysis
      key: species_studied
      type: List[str]
    - description: Key observed trends in gene variation and divergence patterns
      key: observed_trends
      type: List[str]
    - description: Summary of implications for gene evolution understanding
      key: implications_summary
      type: str
    - description: Boolean indicator of statistically significant divergence detected
      key: significant_divergence_detected
      type: bool
    prompt: Analyze existing data from population genetics studies on gene variation
      and divergence across different species, highlighting the implications for our
      understanding of gene evolution.
  compare_genomic_structures_across_species:
    agent: false
    description: Analyze the genomic structure of various species and draw conclusions
      on gene mapping trends
    name: compare_genomic_structures_across_species
    nodes_depended_on:
    - evaluate_genomic_diversity_dinosaurs
    - evaluate_genomic_diversity_cretaceous
    - select_gene_mapping_methods
    nodes_dependent_on: []
    output_structure:
    - description: List of species compared in this analysis
      key: species_list
      type: List[str]
    - description: Concise narrative summarizing key differences and similarities
        in genomic structures
      key: comparison_summary
      type: str
    - description: Primary trends or patterns identified across species (e.g., conserved
        synteny, rearrangement hotspots)
      key: key_trends
      type: List[str]
    - description: Indicates whether the underlying genomic data meets quality thresholds
        for reliable comparison
      key: data_quality_flag
      type: bool
    prompt: Compare the overall genomic structure of different species and draw conclusions
      about the patterns and trends observed in gene mapping
  draw_conclusions_on_gene_mapping_trends:
    agent: false
    description: Conclude the findings on evolutionary tendencies in gene mapping.
    name: draw_conclusions_on_gene_mapping_trends
    nodes_depended_on:
    - compare_genomic_structures_across_species
    nodes_dependent_on: []
    output_structure:
    - description: A concise textual summary of the main conclusions drawn from the
        analysis.
      key: conclusion_text
      type: str
    - description: A list of the most significant evolutionary trends identified in
        gene mapping across species.
      key: key_trends
      type: List[str]
    - description: A list of implications these trends have for our broader understanding
        of genetic evolution.
      key: implications
      type: List[str]
    prompt: Based on the analysis, draw conclusions on the evolutionary tendencies
      observed in gene mapping, and their implications for our understanding of genetic
      evolution.
  evaluate_genomic_diversity_cretaceous:
    agent: false
    description: Assess the role of genomic diversity during the Cretaceous period.
    name: evaluate_genomic_diversity_cretaceous
    nodes_depended_on:
    - analyze_population_genetics_data
    - understand_genetic_evolution_theories
    nodes_dependent_on: []
    output_structure:
    - description: List of key factors influencing genomic diversity during the Cretaceous
        (e.g., gene regulation, epigenetic mechanisms).
      key: genomic_diversity_factors
      type: List[str]
    - description: Quantitative metrics of genomic diversity (e.g., nucleotide diversity
        indices, haplotype variation scores).
      key: diversity_metrics
      type: List[float]
    - description: Explanation of how observed diversity patterns relate to gene evolution
        theories (speciation, drift, etc.).
      key: evolutionary_impact
      type: List[str]
    - description: Whether the assessment supports existing genetic evolution theories
        from parent nodes.
      key: supports_theories
      type: bool
    - description: Concise summary of genomic diversity's role in shaping evolutionary
        tendencies during the Cretaceous.
      key: summary_assessment
      type: str
    prompt: Assess genomic diversity during the Cretaceous period and examine how
      it informs our understanding of gene evolution, considering factors such as
      gene regulation and epigenetics.
  evaluate_genomic_diversity_dinosaurs:
    agent: false
    description: Evaluate the genomic diversity observed in dinosaur populations,
      summarizing key metrics and implications for gene evolution.
    name: evaluate_genomic_diversity_dinosaurs
    nodes_depended_on:
    - analyze_population_genetics_data
    - understand_genetic_evolution_theories
    nodes_dependent_on: []
    output_structure:
    - description: List of dinosaur species evaluated.
      key: species_list
      type: List[str]
    - description: Corresponding genomic diversity index for each species.
      key: diversity_index
      type: List[float]
    - description: Concise insights linking diversity metrics to evolutionary processes.
      key: key_insights
      type: List[str]
    prompt: Assess genomic diversity in dinosaurs and examine how it informs our understanding
      of gene evolution, considering factors such as gene regulation and epigenetics.
  identify_key_factors_affecting_gene_evolution:
    agent: false
    description: Identify the primary factors that drive gene evolution.
    name: identify_key_factors_affecting_gene_evolution
    nodes_depended_on:
    - select_gene_mapping_methods
    - understand_genetic_evolution_theories
    nodes_dependent_on: []
    output_structure:
    - description: A list of the main biological factors that influence gene evolution,
        e.g., recombination, mutation, genetic hitchhiking, and population structure.
      key: key_factors
      type: List[str]
    prompt: List the key factors that influence gene evolution, such as recombination,
      mutation, genetic hitchhiking, and population structure.
  select_gene_mapping_methods:
    agent: false
    description: Select and briefly describe commonly used gene mapping methods.
    name: select_gene_mapping_methods
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Name of the gene mapping method
      key: method_name
      type: str
    - description: Brief description of the method
      key: description
      type: str
    prompt: List and describe the most commonly used gene mapping methods, such as
      linkage analysis, physical mapping, and genetic linkage, without referencing
      any specific study.
  understand_genetic_evolution_theories:
    agent: false
    description: Explain the fundamental principles of genetic evolution.
    name: understand_genetic_evolution_theories
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Names of the key genetic evolution concepts.
      key: concept_names
      type: List[str]
    - description: Brief descriptions for each corresponding concept.
      key: concept_descriptions
      type: List[str]
    prompt: List and briefly describe key concepts related to genetic evolution, such
      as speciation, natural selection, genetic drift, and gene flow.
