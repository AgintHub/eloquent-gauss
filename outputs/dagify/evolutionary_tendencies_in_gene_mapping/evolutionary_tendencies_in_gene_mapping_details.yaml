dag_type: plain_text
description: Generated workflow from UI.
name: evolutionary_tendencies_in_gene_mapping
nodes:
  analyze_population_genetics_data:
    agent: false
    description: Analyze data from existing population genetics studies on gene variation
      and divergence.
    name: analyze_population_genetics_data
    nodes_depended_on:
    - select_gene_mapping_methods
    nodes_dependent_on: []
    output_structure:
    - description: High-level summary of observed gene variation and divergence patterns
      key: summary_findings
      type: str
    - description: Quantified divergence rates between species groups
      key: divergence_rates
      type: List[float]
    - description: Names of species included in the population genetics analysis
      key: species_analyzed
      type: List[str]
    - description: Indicator of whether the analyzed data meets quality thresholds
      key: is_data_valid
      type: bool
    prompt: Analyze existing data from population genetics studies on gene variation
      and divergence across different species, highlighting the implications for our
      understanding of gene evolution.
  compare_genomic_structures_across_species:
    agent: false
    description: Analyze the genomic structure of various species and draw conclusions
      on gene mapping trends
    name: compare_genomic_structures_across_species
    nodes_depended_on:
    - evaluate_genomic_diversity_dinosaurs
    - evaluate_genomic_diversity_cretaceous
    - select_gene_mapping_methods
    nodes_dependent_on: []
    output_structure:
    - description: List of species analyzed for genomic structure comparison
      key: species_compared
      type: List[str]
    - description: Key genomic features evaluated across species (e.g., gene density,
        regulatory regions)
      key: genomic_features_analyzed
      type: List[str]
    - description: Patterns identified in gene mapping across different species
      key: observed_trends
      type: List[str]
    - description: Major conclusions or insights regarding gene mapping evolution
      key: significant_findings
      type: List[str]
    - description: Whether observed trends align with known genetic evolution principles
      key: is_consistent_with_evolutionary_theory
      type: bool
    prompt: Compare the overall genomic structure of different species and draw conclusions
      about the patterns and trends observed in gene mapping
  draw_conclusions_on_gene_mapping_trends:
    agent: false
    description: Conclude the findings on evolutionary tendencies in gene mapping.
    name: draw_conclusions_on_gene_mapping_trends
    nodes_depended_on:
    - compare_genomic_structures_across_species
    nodes_dependent_on: []
    output_structure:
    - description: Summary of the main evolutionary tendencies observed in gene mapping
      key: conclusion_summary
      type: str
    - description: List of specific evolutionary patterns/trends identified across
        species
      key: key_evolutionary_tendencies
      type: List[str]
    - description: Explanation of how these findings impact understanding of genetic
        evolution
      key: implications_for_genetic_evolution
      type: str
    - description: List of genomic factors contributing to observed evolutionary tendencies
      key: supporting_factors
      type: List[str]
    - description: Whether significant evolutionary mapping trends were confirmed
      key: trends_identified
      type: bool
    prompt: Based on the analysis, draw conclusions on the evolutionary tendencies
      observed in gene mapping, and their implications for our understanding of genetic
      evolution.
  evaluate_genomic_diversity_cretaceous:
    agent: false
    description: Assess the role of genomic diversity during the Cretaceous period.
    name: evaluate_genomic_diversity_cretaceous
    nodes_depended_on:
    - analyze_population_genetics_data
    - understand_genetic_evolution_theories
    nodes_dependent_on: []
    prompt: Assess genomic diversity during the Cretaceous period and examine how
      it informs our understanding of gene evolution, considering factors such as
      gene regulation and epigenetics.
  evaluate_genomic_diversity_dinosaurs:
    agent: false
    description: Assess the role of genomic diversity in dinosaur gene evolution.
    name: evaluate_genomic_diversity_dinosaurs
    nodes_depended_on:
    - analyze_population_genetics_data
    - understand_genetic_evolution_theories
    nodes_dependent_on: []
    output_structure:
    - description: Quantitative measures of genomic diversity in dinosaur species
        (e.g., heterozygosity indices, mutation rates)
      key: diversity_metrics
      type: List[float]
    - description: Primary factors influencing genomic diversity in dinosaurs (e.g.,
        gene regulation mechanisms, epigenetic patterns)
      key: key_factors
      type: List[str]
    - description: Whether observed genomic diversity demonstrates statistically significant
        variation relevant to evolutionary patterns
      key: has_significant_diversity
      type: bool
    - description: Summary of how dinosaur genomic diversity patterns inform broader
        understanding of gene evolution
      key: evolutionary_implications
      type: str
    prompt: Assess genomic diversity in dinosaurs and examine how it informs our understanding
      of gene evolution, considering factors such as gene regulation and epigenetics.
  identify_key_factors_affecting_gene_evolution:
    agent: false
    description: Identify the primary factors that drive gene evolution.
    name: identify_key_factors_affecting_gene_evolution
    nodes_depended_on:
    - select_gene_mapping_methods
    - understand_genetic_evolution_theories
    nodes_dependent_on: []
    prompt: List the key factors that influence gene evolution, such as recombination,
      mutation, genetic hitchhiking, and population structure.
  select_gene_mapping_methods:
    agent: false
    description: Select and briefly describe commonly used gene mapping methods
    name: select_gene_mapping_methods
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List and describe the most commonly used gene mapping methods, such as
      linkage analysis, physical mapping, and genetic linkage, without referencing
      any specific study.
  understand_genetic_evolution_theories:
    agent: false
    description: Explain the fundamental principles of genetic evolution.
    name: understand_genetic_evolution_theories
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List and briefly describe key concepts related to genetic evolution, such
      as speciation, natural selection, genetic drift, and gene flow.
